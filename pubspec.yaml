name: carrot_timer
description: "Carrot Timer - a tiny pomodoro timer for macOS. Carrots, not tomatoes."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  window_manager: ^0.5.2
  shared_preferences: ^2.5.5
  local_notifier: ^0.1.6
  clock: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.0

flutter:
  uses-material-design: true
